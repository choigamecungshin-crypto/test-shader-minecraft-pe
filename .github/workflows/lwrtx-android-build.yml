name: LWRTX Android ARM64 build

on:
  push:
    paths:
      - "lwrtx/native/**"
      - ".github/workflows/lwrtx-android-build.yml"
  workflow_dispatch:

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure ARM64 build
        run: >
          cmake -S lwrtx/native -B build/android-arm64
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DLWRTX_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build shared callback
        run: cmake --build build/android-arm64 --parallel 2
      - name: Upload development library
        uses: actions/upload-artifact@v4
        with:
          name: lwrtx-gles-hook-arm64-v8a
          path: build/android-arm64/liblwrtx_gles_hook.so
          if-no-files-found: error
          retention-days: 14
