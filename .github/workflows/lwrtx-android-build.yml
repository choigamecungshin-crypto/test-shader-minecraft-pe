name: LWRTX Android ARM64 build

on:
  push:
    paths:
      - "lwrtx/native/**"
      - ".github/workflows/lwrtx-android-build.yml"
  workflow_dispatch:

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Download ShadowHook AAR
        run: |
          curl -fL --retry 3 -o /tmp/shadowhook.aar \
            https://repo.maven.apache.org/maven2/com/bytedance/android/shadowhook/2.0.1/shadowhook-2.0.1.aar
          mkdir -p build/shadowhook
          unzip -q /tmp/shadowhook.aar -d build/shadowhook
          test -f build/shadowhook/prefab/modules/shadowhook/include/shadowhook.h
          test -f build/shadowhook/prefab/modules/shadowhook/libs/android.arm64-v8a/libshadowhook.so
      - name: Configure ARM64 build
        run: |
          cmake -S lwrtx/native -B build/android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DLWRTX_SHADOWHOOK_ROOT="$GITHUB_WORKSPACE/build/shadowhook/prefab/modules/shadowhook" \
            -DLWRTX_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build shared hook
        run: cmake --build build/android-arm64 --parallel 2
      - name: Stage runtime libraries
        run: |
          mkdir -p dist/arm64-v8a
          cp build/android-arm64/liblwrtx_gles_hook.so dist/arm64-v8a/
          cp build/shadowhook/prefab/modules/shadowhook/libs/android.arm64-v8a/libshadowhook.so dist/arm64-v8a/
          readelf -h dist/arm64-v8a/liblwrtx_gles_hook.so
          readelf -d dist/arm64-v8a/liblwrtx_gles_hook.so
      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: lwrtx-runtime-arm64-v8a
          path: dist/arm64-v8a/
          if-no-files-found: error
          retention-days: 14
