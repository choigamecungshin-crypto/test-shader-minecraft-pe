name: LWRTX Bedrock APK build

on:
  push:
    paths:
      - "lwrtx/**"
      - "tools/**"
      - ".github/workflows/lwrtx-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lwrtx-bedrock-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout LWRTX source
        uses: actions/checkout@v4

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ANDROID_HOME/build-tools/36.0.0/zipalign" >> "$GITHUB_ENV"
          echo "APKSIGNER=$ANDROID_HOME/build-tools/36.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Install ELF and APK patching utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y patchelf zip binutils
          command -v patchelf
          command -v zip
          command -v readelf
          "$ZIPALIGN" -h >/dev/null 2>&1 || true
          "$APKSIGNER" version

      - name: Download the original APK from the private test repository Release
        shell: bash
        env:
          TEST_REPO_READ_TOKEN: ${{ secrets.TEST_REPO_READ_TOKEN }}
          APK_ASSET_API: https://api.github.com/repos/choigamecungshin-crypto/test/releases/assets/735506478
          EXPECTED_SHA256: 3334ca3561da2e92ccbaca87fc03d0786e4bd1d9137d5ccc073b8e0dcf9cd304
        run: |
          set -euo pipefail
          if [ -z "${TEST_REPO_READ_TOKEN:-}" ]; then
            echo "::error::Add TEST_REPO_READ_TOKEN in this repository's Actions secrets. It needs read-only Contents access to choigamecungshin-crypto/test."
            exit 1
          fi
          mkdir -p input
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $TEST_REPO_READ_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --output input/Minecraft_1.26.60.4.apk "$APK_ASSET_API"
          echo "$EXPECTED_SHA256  input/Minecraft_1.26.60.4.apk" | sha256sum --check
          stat -c 'Original APK size: %s bytes' input/Minecraft_1.26.60.4.apk

      - name: Run host regression tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S lwrtx/native -B build/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host --parallel 2
          ctest --test-dir build/host --output-on-failure

      - name: Inspect original APK and unpack UI archives
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/brarchive_unpack.py tools/brarchive_pack.py tools/patch-lwrtx-ui.py
          bash -n tools/inspect-apk.sh
          bash -n tools/patch-apk.sh
          bash tools/inspect-apk.sh input/Minecraft_1.26.60.4.apk build/apk-inspection

      - name: Download ShadowHook 2.0.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output build/shadowhook.aar \
            https://repo.maven.apache.org/maven2/com/bytedance/android/shadowhook/2.0.1/shadowhook-2.0.1.aar
          mkdir -p build/shadowhook
          unzip -q build/shadowhook.aar -d build/shadowhook
          test -f build/shadowhook/prefab/modules/shadowhook/include/shadowhook.h
          test -f build/shadowhook/prefab/modules/shadowhook/libs/android.arm64-v8a/libshadowhook.so

      - name: Configure and build LWRTX Android ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake -S lwrtx/native -B build/android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DLWRTX_SHADOWHOOK_ROOT="$GITHUB_WORKSPACE/build/shadowhook/prefab/modules/shadowhook" \
            -DLWRTX_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/android-arm64 --parallel 2
          mkdir -p dist/arm64-v8a
          cp build/android-arm64/liblwrtx_gles_hook.so dist/arm64-v8a/
          cp build/shadowhook/prefab/modules/shadowhook/libs/android.arm64-v8a/libshadowhook.so dist/arm64-v8a/
          readelf -h dist/arm64-v8a/liblwrtx_gles_hook.so
          readelf -d dist/arm64-v8a/liblwrtx_gles_hook.so

      - name: Create temporary test signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -v \
            -keystore "$RUNNER_TEMP/lwrtx-test.keystore" \
            -storepass android -keypass android \
            -alias lwrtx -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LWRTX experimental test"

      - name: Patch and sign the APK
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$ZIPALIGN" APKSIGNER="$APKSIGNER" \
            bash tools/patch-apk.sh \
              input/Minecraft_1.26.60.4.apk \
              dist/arm64-v8a \
              dist/Minecraft_1.26.60.4_LWRTX_test.apk \
              "$RUNNER_TEMP/lwrtx-test.keystore"
          ls -lh dist/Minecraft_1.26.60.4_LWRTX_test.apk*
          sha256sum dist/Minecraft_1.26.60.4_LWRTX_test.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-1.26.60.4-LWRTX-test-apk
          path: |
            dist/Minecraft_1.26.60.4_LWRTX_test.apk
            dist/Minecraft_1.26.60.4_LWRTX_test.apk.metadata.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ARM64 runtime libraries
        uses: actions/upload-artifact@v4
        with:
          name: lwrtx-runtime-arm64-v8a
          path: dist/arm64-v8a/
          if-no-files-found: error
          retention-days: 14

      - name: Upload original APK inspection report
        uses: actions/upload-artifact@v4
        with:
          name: lwrtx-original-apk-inspection
          path: build/apk-inspection/
          if-no-files-found: error
          retention-days: 14
