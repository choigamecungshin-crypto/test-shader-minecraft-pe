name: Inspect Minecraft PE APK for LWRTX integration

on:
  push:
    paths:
      - ".github/workflows/lwrtx-apk-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout LWRTX source
        uses: actions/checkout@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apkanalyzer"

      - name: Download Minecraft PE 1.26.60.4 from test release
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/choigamecungshin-crypto/test/releases/download/Minecraft-1.26.60.4/Minecraft_1.26.60.4.apk"
          curl --fail --location --show-error --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 5400 -o minecraft.apk "$URL"
          test -s minecraft.apk
          echo "APK_SHA256=$(sha256sum minecraft.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s minecraft.apk)" >> "$GITHUB_ENV"

      - name: Inspect APK and extract ARM64 graphics evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report/native
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKANALYZER="$ANDROID_HOME/build-tools/35.0.0/apkanalyzer"

          unzip -Z1 minecraft.apk > report/apk-file-list.txt
          "$AAPT" dump badging minecraft.apk > report/badging.txt
          unzip -p minecraft.apk AndroidManifest.xml > report/AndroidManifest.xml
          "$APKANALYZER" manifest application-id minecraft.apk > report/application-id.txt || true
          "$APKANALYZER" manifest min-sdk minecraft.apk > report/min-sdk.txt || true
          "$APKANALYZER" manifest target-sdk minecraft.apk > report/target-sdk.txt || true

          {
            echo "LWRTX APK integration reconnaissance"
            echo "APK size: $APK_SIZE bytes"
            echo "APK SHA-256: $APK_SHA256"
            echo
            echo "=== Package metadata ==="
            head -100 report/badging.txt
            echo
            echo "=== Relevant APK entries ==="
            grep -Ei '(^|/)(libminecraftpe[.]so|[^/]*(graphics|render|option|setting|resource)[^/]*|AndroidManifest[.]xml)$|^assets/' report/apk-file-list.txt | head -700 || true
            echo
            echo "=== ARM64 native libraries ==="
            grep -E '^lib/arm64-v8a/.*[.]so$' report/apk-file-list.txt || true
          } > report/apk-overview.txt

          LIB_PATH="$(grep -Fxm1 'lib/arm64-v8a/libminecraftpe.so' report/apk-file-list.txt || true)"
          if [ -z "$LIB_PATH" ]; then
            LIB_PATH="$(grep -Em1 '^lib/arm64-v8a/[^/]*minecraft[^/]*[.]so$' report/apk-file-list.txt || true)"
          fi

          if [ -n "$LIB_PATH" ]; then
            echo "$LIB_PATH" > report/native/library-path.txt
            unzip -p minecraft.apk "$LIB_PATH" > report/native/libminecraftpe.so
            test -s report/native/libminecraftpe.so
            {
              echo "Native library path: $LIB_PATH"
              echo "Native library size: $(stat -c%s report/native/libminecraftpe.so)"
              echo
              echo "=== ELF header ==="
              readelf -h report/native/libminecraftpe.so
              echo
              echo "=== Needed libraries ==="
              readelf -d report/native/libminecraftpe.so | grep NEEDED || true
              echo
              echo "=== Graphics/menu strings (ASCII) ==="
              strings -a report/native/libminecraftpe.so | grep -Ei 'Vibrant Visuals|Ray Tracing|Graphics Mode|graphics mode|rendering|shader|raytrac|vibrant|deferred|lighting' | head -700 || true
              echo
              echo "=== Graphics/menu strings (UTF-16LE) ==="
              strings -el report/native/libminecraftpe.so | grep -Ei 'Vibrant Visuals|Ray Tracing|Graphics Mode|graphics mode|rendering|shader|raytrac|vibrant|deferred|lighting' | head -700 || true
              echo
              echo "=== Dynamic symbols related to graphics ==="
              readelf -Ws report/native/libminecraftpe.so | grep -Ei 'shader|render|graphics|option|setting|gles|egl|vulkan' | head -500 || true
            } > report/native-graphics-strings.txt
            rm -f report/native/libminecraftpe.so
          else
            echo "No ARM64 Minecraft native library found in APK." > report/native-graphics-strings.txt
          fi

          {
            echo "APK_SHA256=$APK_SHA256"
            echo "APK_SIZE=$APK_SIZE"
            echo "LIB_PATH=$LIB_PATH"
          } > report/build-metadata.txt

      - name: Upload APK inspection report
        uses: actions/upload-artifact@v4
        with:
          name: lwrtx-minecraft-1.26.60.4-apk-inspection
          path: report/
          if-no-files-found: error
          retention-days: 14
